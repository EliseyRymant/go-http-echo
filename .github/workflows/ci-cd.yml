name: Build Image and Update Helm Chart

on:
  push:
    tags:
      - "dev-v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Extract Tag Name
        id: vars
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/eliseyrymant/http-echo-app:${{ steps.vars.outputs.TAG }}

      - name: Checkout Helm Chart Repo
        uses: actions/checkout@v4
        with:
          repository: "EliseyRymant/argocd-go-http" # Ваш infra репозиторий
          token: ${{ secrets.INFRA_REPO_PAT }} # PAT токен с правами repo
          path: "infra-repo"

      - name: Update image tag in values.yaml
        run: |
          cd infra-repo/helm/http-echo
          sed -i 's/tag: .*/tag: "${{ steps.vars.outputs.TAG }}"/' values.yaml

      - name: Commit and Push changes to Infra Repo
        run: |
          cd infra-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/http-echo/values.yaml
          git commit -m "chore: update image tag to ${{ steps.vars.outputs.TAG }}"
          git push
